site_name: NAGISA's Blog
site_author: NAGISA
site_description: 学习、教学与科研的个人记录
site_url: https://kujostar.github.io/
copyright: © 2022–2026 NAGISA
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - toc.follow
    - navigation.top
plugins: []
hooks:
  - hooks.py
nav:
  - 首页: index.md
  - 内容: blog/index.md
  - 标签: tags/index.md
  - 友链: friends/index.md
extra:
  tagline: 学习、教学与科研的个人记录
  github: https://github.com/KujoStar
  giscus:
    enabled: true
    repo: KujoStar/KujoStar.github.io
    repo_id: "R_kgDOIu0ofw"
    category: Announcements
    category_id: "DIC_kwDOIu0of84DI_7I"
extra_css:
  - stylesheets/site.css
extra_javascript:
  - javascripts/search-core.js
  - javascripts/site.js
markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - tables
  - sane_lists
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      stripnl: false
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      permalink_title: 此章节链接
      toc_depth: 2-6
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: warn
    not_found: warn
    anchors: warn
