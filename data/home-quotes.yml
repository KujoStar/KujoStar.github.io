quotes:
  - lang: en
    lines:
      - Day before yesterday I saw a rabbit,
      - and yesterday a deer,
      - and today, you.
  - lang: zh-CN
    lines:
      - 有话直说，说到做到，
      - 这就是我的忍道。
  - lang: en
    lines:
      - Where there is a will,
      - there is a way.
  - lang: zh-CN
    lines:
      - 天若有情天亦老，
      - 人间正道是沧桑。
  - lang: zh-CN
    lines:
      - 黑夜给了我黑色的眼睛，
      - 我却用它寻找光明。
